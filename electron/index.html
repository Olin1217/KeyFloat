<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KeyFloat</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <button id="collapsed" class="collapsed-shell" type="button" aria-label="展开快捷键助手">
      <span class="drag-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <span id="collapsed-logo" class="app-logo app-logo--figma" aria-hidden="true"></span>
      <span class="collapsed-copy">
        <strong id="collapsed-name">Figma</strong>
        <small id="collapsed-hint">快捷键助手</small>
      </span>
      <span class="collapsed-count" id="collapsed-count">126</span>
      <span class="chevron" aria-hidden="true">
        <svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" /></svg>
      </span>
    </button>

    <main id="expanded" class="panel" aria-hidden="true">
      <header class="titlebar">
        <span class="drag-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <button id="software-button" class="software-button no-drag" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span id="header-logo" class="app-logo app-logo--figma" aria-hidden="true"></span>
          <span class="software-copy">
            <strong id="software-name">Figma</strong>
            <small id="library-label">快捷键库</small>
          </span>
          <svg class="select-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" /></svg>
        </button>

        <div class="window-actions no-drag">
          <button id="pin-button" class="icon-button is-active" type="button" aria-label="取消置顶" title="取消置顶">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.3 3.5h5.4l-.7 4 2.1 2.1v1H5.9v-1L8 7.5l-.7-4Z"/><path d="M10 10.6v5.9"/></svg>
          </button>
          <button id="lang-button" class="text-button" type="button" aria-label="Switch to English">中</button>
          <button id="collapse-button" class="icon-button" type="button" aria-label="收起" title="收起">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10" /></svg>
          </button>
          <button id="close-button" class="icon-button close-button" type="button" aria-label="退出" title="退出">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8M14 6l-8 8" /></svg>
          </button>
        </div>
      </header>

      <section class="toolbar no-drag">
        <label class="search-field" for="search-input">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.7" cy="8.7" r="5.1"/><path d="m12.5 12.5 3.6 3.6"/></svg>
          <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="搜索命令、工具或按键" />
          <kbd id="search-key">⌘ K</kbd>
        </label>
        <div class="toolbar-row">
          <div class="filter-tabs" role="tablist" aria-label="列表筛选">
            <button id="all-filter" class="filter-button is-active" type="button" role="tab">全部</button>
            <button id="favorite-filter" class="filter-button" type="button" role="tab">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m8 2 1.7 3.6 3.9.5-2.9 2.8.8 4L8 11l-3.5 1.9.8-4-2.9-2.8 3.9-.5L8 2Z"/></svg>
              <span id="favorite-filter-label">收藏</span>
            </button>
          </div>
          <div class="platform-switch" aria-label="键盘系统">
            <button id="mac-button" class="is-active" type="button">macOS</button>
            <button id="win-button" type="button">Win</button>
          </div>
        </div>
      </section>

      <nav id="category-tabs" class="category-tabs no-drag" aria-label="快捷键分类"></nav>

      <div class="list-meta">
        <span id="result-summary">全部快捷键</span>
        <span id="result-count">0 项</span>
      </div>

      <section id="shortcut-list" class="shortcut-list no-drag" aria-live="polite"></section>

      <footer class="footer no-drag">
        <span id="footer-tip"><kbd>Esc</kbd> 收起 · <kbd>⌘ K</kbd> 搜索</span>
        <span class="brand-mark"><i></i> KeyFloat</span>
      </footer>

      <section id="software-picker" class="software-picker no-drag" role="dialog" aria-modal="true" aria-hidden="true">
        <button id="picker-backdrop" class="picker-backdrop" type="button" aria-label="关闭软件选择"></button>
        <div class="picker-card">
          <div class="picker-header">
            <div>
              <strong id="picker-title">选择软件</strong>
              <small id="picker-subtitle">切换当前快捷键库</small>
            </div>
            <button id="picker-close" class="icon-button" type="button" aria-label="关闭">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8M14 6l-8 8" /></svg>
            </button>
          </div>
          <div id="software-grid" class="software-grid"></div>
          <p id="picker-note" class="picker-note">更多设计、视频与 3D 软件快捷键库会持续加入。</p>
        </div>
      </section>
    </main>

    <script src="data/shortcuts.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
